# Konfiguracja programu tsp_ga.
# Format: klucz = wartosc. Komentarze zaczynaja sie od znaku #.
# Uruchomienie:
#   make
#   ./tsp_ga config/experiment.cfg

# Plik CSV z lista instancji: label,path,opt,kind,source.
instances_file = config/instances.csv

# Plik wynikowy CSV. Program dopisuje naglowek i nadpisuje poprzedni plik.
output_csv = results/experiment_results.csv

# Katalog na najlepsze trasy w formacie podobnym do TSPLIB TOUR_SECTION.
tour_output_dir = results/tours

# Liczba niezaleznych uruchomien na kazda instancje.
repetitions = 3

# Ziarno generatora. Dla powtorzenia r program uzywa seed + 1000003*r + hash(instancji).
seed = 20260607

# Rozmiar populacji GA.
population_size = 90

# Maksymalna liczba generacji. Limit czasu moze zatrzymac run wczesniej.
generations = 650

# Limit czasu w sekundach na jedna probe dla jednej instancji.
time_limit_seconds = 3.0

# Liczba osobnikow kopiowanych bez zmian do kolejnej populacji.
elite_count = 3

# Rozmiar turnieju selekcyjnego.
tournament_size = 4

# Prawdopodobienstwo krzyzowania OX; pozostale dzieci sa kopiami rodzica.
crossover_rate = 0.92

# Prawdopodobienstwo wykonania mutacji na dziecku.
mutation_rate = 0.34

# Prawdopodobienstwo lokalnego ulepszania dziecka.
local_search_rate = 0.35

# Maksymalna liczba zaakceptowanych ruchow lokalnego ulepszania jednego dziecka.
local_search_max_moves = 45

# Liczba najblizszych sasiadow rozpatrywanych w 2-opt dla TSP symetrycznego.
candidate_list_size = 24

# Liczba tras startowych tworzonych metoda najblizszego sasiada.
nearest_neighbor_seeds = 24

# Po ilu generacjach bez poprawy przerwac probe.
stagnation_generations = 220

# Czy zapisywac najlepsza trase z kazdej proby: true/false.
write_tours = true
